<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document History</title>
    <link rel="stylesheet" href="style.css" />
    <!-- init.js is generated by entry.py before the palette is shown. It defines
         window.__ptInit synchronously so the theme and title are correct on the
         first paint with no round-trip. The history itself arrives later, over
         sendInfoToHTML, because reading it is a cloud call. -->
    <script src="init.js"></script>
    <script>
        // Apply the theme before the UI renders so there is no flash.
        (function () {
            try {
                var d = window.__ptInit;
                if (d && d.theme === 'light') {
                    document.documentElement.className = 'light';
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>

<body>
    <div class="app">
        <header>
            <h1 id="doc-name"></h1>
        </header>

        <!-- The controls row: how much history this is, and the one layout
             option. Mirrors the web view's header exactly. -->
        <div class="controls">
            <span class="caption" id="version-count"></span>
            <label class="toggle" id="thread-toggle">
                <input type="checkbox" id="thread-check" />
                <span>Show thread across days</span>
            </label>
        </div>

        <div class="banner" id="banner"></div>

        <!-- The scroll container. Day view is fitted to the panel and never
             overflows sideways. Thread view owns BOTH axes, so it is
             height-bounded and both scrollbars stay at the edges of something
             the reader can actually see. -->
        <div class="scroller" id="scroller">
            <div class="stack" id="stack"></div>
        </div>

        <div class="more" id="more"></div>
        <div class="legend" id="legend"></div>
    </div>

    <!-- One floating card, reused: the hover card for a save, and the hint on
         the thread checkbox. Native title tooltips are unthemed and unbounded,
         so the palettes here never use them. -->
    <div class="card" id="card" hidden></div>

    <script src="app.js"></script>
</body>

</html>
