<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team Add-ins</title>
    <link rel="stylesheet" href="report.css" />
    <!-- init.js is generated by entry.py before the palette is shown. It defines
         window.__ptTeamAddins synchronously so the theme and the report are
         correct on first paint with no round-trip. -->
    <script src="init.js"></script>
    <script>
        // Apply the theme before the UI renders so there is no flash.
        (function () {
            try {
                var d = window.__ptTeamAddins;
                if (d && d.theme === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body class="dark">
    <div class="app">
        <header>
            <h1 id="headline">Team Add-ins</h1>
            <p class="detail" id="detail"></p>
        </header>
        <div class="banner" id="banner" hidden></div>
        <main id="content"></main>
        <footer>
            <span class="meta" id="meta"></span>
            <span class="spacer"></span>
            <button type="button" id="configure" class="secondary" hidden>
                Create shared folder…
            </button>
            <button type="button" id="close" class="primary">Close</button>
        </footer>
    </div>
    <script src="report.js"></script>
</body>
</html>
