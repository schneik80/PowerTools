<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PowerTools Preferences</title>
    <link rel="stylesheet" href="style.css" />
    <!-- init.js is generated by entry.py before the palette is shown. It defines
         window.__ptInit synchronously so the theme + state are correct on first
         paint with no round-trip. -->
    <script src="init.js"></script>
    <script>
        // Apply the theme before the UI renders so there is no flash.
        (function () {
            try {
                var d = window.__ptInit;
                document.documentElement.classList.add('preload');
                if (d && d.theme === 'light') document.body && document.body.classList.add('light');
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body class="dark">
    <div class="app">
        <header>
            <h1>PowerTools Preferences</h1>
            <div class="banner" id="banner"></div>
        </header>
        <div class="main">
            <nav id="nav"></nav>
            <div class="content" id="content"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
